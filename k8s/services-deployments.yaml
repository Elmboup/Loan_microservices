# deployments and services for each python microservice and corresponding Celery workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: loan-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
        - name: loan-service
          image: loan-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: loan-app
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: loan-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-service
  namespace: loan-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-service
  template:
    metadata:
      labels:
        app: credit-service
    spec:
      containers:
        - name: credit-service
          image: credit-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/1"
---
apiVersion: v1
kind: Service
metadata:
  name: credit-service
  namespace: loan-app
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: credit-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-worker
  namespace: loan-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-worker
  template:
    metadata:
      labels:
        app: credit-worker
    spec:
      containers:
        - name: credit-worker
          image: credit-service:latest
          command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "-Q", "credit"]
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/1"
---
