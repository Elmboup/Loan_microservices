<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loan Dashboard</title>
    <style>
      :root {
        --bg: #f4f2ed;
        --panel: #ffffff;
        --ink: #1f1f1f;
        --muted: #6f6a60;
        --accent: #1f6f54;
        --border: #e2ded6;
        --shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        --mono: "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--display);
        color: var(--ink);
        background: radial-gradient(circle at 10% 20%, #fdfbf7 0%, #f4f2ed 40%, #efece6 100%);
      }
      header {
        padding: 20px 28px;
        border-bottom: 1px solid var(--border);
        background: #fffaf2;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.4px;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: 260px 1fr 320px;
        gap: 16px;
        padding: 20px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: var(--shadow);
        min-height: 200px;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .loans {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .loan-item {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid transparent;
        cursor: pointer;
        background: #faf8f3;
        transition: all 0.15s ease;
      }
      .loan-item.active {
        border-color: var(--accent);
        background: #e9f3ee;
      }
      .loan-item small {
        display: block;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        margin-top: 4px;
      }
      .status {
        padding: 8px 12px;
        border-radius: 999px;
        background: #111;
        color: #fff;
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .timeline {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .event {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px dashed var(--border);
        background: #fff;
      }
      .event .type {
        font-weight: 600;
        font-size: 13px;
      }
      .event .meta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .latest {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 520px;
        overflow-y: auto;
      }
      .latest .event {
        background: #fcfbf7;
      }
      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Dashboard prêts immobiliers</h1>
      <p>Suivi temps réel des décisions, accords et compensations.</p>
    </header>

    <div class="layout">
      <section class="panel">
        <h2>Loans</h2>
        <div id="loanList" class="loans"></div>
      </section>

      <section class="panel">
        <h2>Détail</h2>
        <div id="selectedLoanId" class="meta"></div>
        <div style="margin: 12px 0;">
          <span id="statusBadge" class="status">SELECT LOAN</span>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>

      <section class="panel">
        <h2>Latest events</h2>
        <div id="latestEvents" class="latest"></div>
      </section>
    </div>

    <script>
      const state = {
        selectedLoanId: null,
        eventsByLoan: {},
        statusByLoan: {},
        latestEvents: []
      };

      const loanListEl = document.getElementById('loanList');
      const timelineEl = document.getElementById('timeline');
      const latestEl = document.getElementById('latestEvents');
      const statusBadgeEl = document.getElementById('statusBadge');
      const selectedLoanEl = document.getElementById('selectedLoanId');

      function deriveStatus(event) {
        const type = event.event_type;
        const payload = event.payload || {};
        if (type === 'loan.created') return 'CREATED';
        if (type === 'loan.documents.requested') return 'DOCS_REQUESTED';
        if (type === 'loan.documents.received') return 'DOCS_RECEIVED';
        if (type === 'decision.made') return payload.eligible ? 'ELIGIBLE' : 'NOT_ELIGIBLE';
        if (type === 'acceptance.package.sent') return 'AGREEMENT_PENDING';
        if (type === 'agreement.accepted') return 'APPROVED';
        if (type === 'agreement.declined' || type === 'loan.cancelled') return 'CANCELLED';
        if (type === 'loan.rejected') return 'REJECTED';
        if (type === 'loan.final.approved') return 'APPROVED';
        return null;
      }

      function addLatest(event) {
        state.latestEvents.push(event);
        if (state.latestEvents.length > 100) {
          state.latestEvents = state.latestEvents.slice(-100);
        }
      }

      function addEvent(event) {
        const loanId = event.loan_id;
        addLatest(event);

        if (loanId) {
          if (!state.eventsByLoan[loanId]) {
            state.eventsByLoan[loanId] = [];
          }
          state.eventsByLoan[loanId].push(event);
          const status = deriveStatus(event);
          if (status) {
            state.statusByLoan[loanId] = status;
          }
        }
      }

      function renderLoans() {
        const loans = Object.keys(state.eventsByLoan).sort();
        loanListEl.innerHTML = '';
        loans.forEach((loanId) => {
          const item = document.createElement('div');
          item.className = 'loan-item' + (loanId === state.selectedLoanId ? ' active' : '');
          item.innerHTML = `<strong>${loanId.slice(0, 8)}...</strong><small>${state.statusByLoan[loanId] || 'UNKNOWN'}</small>`;
          item.onclick = () => {
            state.selectedLoanId = loanId;
            renderLoans();
            renderTimeline();
          };
          loanListEl.appendChild(item);
        });
      }

      function renderTimeline() {
        timelineEl.innerHTML = '';
        if (!state.selectedLoanId) {
          selectedLoanEl.textContent = '';
          statusBadgeEl.textContent = 'SELECT LOAN';
          return;
        }
        selectedLoanEl.textContent = `Loan: ${state.selectedLoanId}`;
        statusBadgeEl.textContent = state.statusByLoan[state.selectedLoanId] || 'UNKNOWN';
        const events = state.eventsByLoan[state.selectedLoanId] || [];
        events.forEach((event) => {
          const el = document.createElement('div');
          el.className = 'event';
          el.innerHTML = `
            <div class="type">${event.event_type}</div>
            <div class="meta">${event.timestamp || ''}</div>
          `;
          timelineEl.appendChild(el);
        });
      }

      function renderLatest() {
        latestEl.innerHTML = '';
        state.latestEvents.slice().reverse().forEach((event) => {
          const el = document.createElement('div');
          el.className = 'event';
          el.innerHTML = `
            <div class="type">${event.event_type}</div>
            <div class="meta">${event.loan_id || 'global'} · ${event.timestamp || ''}</div>
          `;
          latestEl.appendChild(el);
        });
      }

      function bootstrap() {
        fetch('/loans')
          .then((res) => res.json())
          .then((loans) => {
            loans.forEach((loan) => {
              state.eventsByLoan[loan.loan_id] = [];
              state.statusByLoan[loan.loan_id] = loan.status || 'UNKNOWN';
            });
            renderLoans();
          })
          .catch(() => {});

        const source = new EventSource('/events');
        source.onmessage = (evt) => {
          const event = JSON.parse(evt.data);
          addEvent(event);
          renderLoans();
          if (state.selectedLoanId === event.loan_id) {
            renderTimeline();
          }
          renderLatest();
        };
      }

      bootstrap();
    </script>
  </body>
  </html>
